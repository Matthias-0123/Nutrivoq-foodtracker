
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Again - Nutrivoq</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main class="container">
    <h1>Nutrivoq</h1>
    <h2>Log Again: {{ entry.food_name }}</h2>

    {% for message in get_flashed_messages() %}
        <p class="message">{{ message }}</p>
    {% endfor %}

    <p class="muted">
        Previously logged: {{ entry.amount }} g —
        {{ entry.calories }} kcal
    </p>

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label for="amount">Amount (g)</label>
        <input
            type="number"
            id="amount"
            name="amount"
            min="0.1"
            max="10000"
            step="0.1"
            value="{{ entry.amount }}"
            required
        >

        <button type="submit">Add to Today</button>
    </form>

    <a href="{{ url_for('search_food') }}" class="action-link">
        Back to Food Hub
    </a>
</main>
</body>
</html>
