
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Food - Jumbo Food Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main class="container">
    <h1>{{ product.name }}</h1>
    <p>Enter the amount you consumed.</p>

    {% for message in get_flashed_messages() %}
        <p class="message">{{ message }}</p>
    {% endfor %}

    <section class="results">
        <h2>Nutrition per 100g</h2>

        <div class="macro">
            <span>Calories</span>
            <strong>{{ product.calories }} kcal</strong>
        </div>

        <div class="macro">
            <span>Protein</span>
            <strong>{{ product.protein }} g</strong>
        </div>

        <div class="macro">
            <span>Carbs</span>
            <strong>{{ product.carbs }} g</strong>
        </div>

        <div class="macro">
            <span>Fat</span>
            <strong>{{ product.fat }} g</strong>
        </div>
    </section>

    <form method="POST">
        <label for="amount">Amount (g)</label>
        <input
            type="number"
            id="amount"
            name="amount"
            value="100"
            min="0.1"
            max="10000"
            step="0.1"
            required
        >

        <button type="submit">Add to Daily Tracker</button>
    </form>

    <p><a href="{{ url_for('search_food') }}">Back to Search</a></p>
</main>
</body>
</html>
