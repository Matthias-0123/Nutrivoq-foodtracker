
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Food - Nutrivoq Food Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main class="container">
    <h1>{{ product.name }}</h1>

    {% if product.image %}
        <img
            src="{{ product.image }}"
            alt="{{ product.name }}"
            class="selected-product-image"
        >
    {% endif %}

    {% for message in get_flashed_messages() %}
        <p class="message">{{ message }}</p>
    {% endfor %}

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label for="amount">Amount (g)</label>
        <input
            type="number"
            id="amount"
            name="amount"
            value="100"
            min="0.1"
            max="10000"
            step="0.1"
            required
        >

        <section class="nutrition-card">
            <h2>Calculated Nutrition</h2>

            <div class="macro">
                <span>Calories</span>
                <strong id="calories-value"></strong>
            </div>

            <div class="macro">
                <span>Protein</span>
                <strong id="protein-value"></strong>
            </div>

            <div class="macro">
                <span>Carbs</span>
                <strong id="carbs-value"></strong>
            </div>

            <div class="macro">
                <span>Fat</span>
                <strong id="fat-value"></strong>
            </div>
        </section>

        <button type="submit">Add to Daily Tracker</button>
    </form>

    <p>
        <a href="{{ url_for('search_food') }}">
            Back to Search
        </a>
    </p>
</main>

<script>
    const nutritionPer100 = {
        calories: {{ product.calories | tojson }},
        protein: {{ product.protein | tojson }},
        carbs: {{ product.carbs | tojson }},
        fat: {{ product.fat | tojson }}
    };

    const amountInput = document.getElementById("amount");

    function updateNutrition() {
        const amount = Math.max(0, Number(amountInput.value) || 0);
        const multiplier = amount / 100;

        document.getElementById("calories-value").textContent =
            (nutritionPer100.calories * multiplier).toFixed(1) + " kcal";

        document.getElementById("protein-value").textContent =
            (nutritionPer100.protein * multiplier).toFixed(1) + " g";

        document.getElementById("carbs-value").textContent =
            (nutritionPer100.carbs * multiplier).toFixed(1) + " g";

        document.getElementById("fat-value").textContent =
            (nutritionPer100.fat * multiplier).toFixed(1) + " g";
    }

    amountInput.addEventListener("input", updateNutrition);

    updateNutrition();
</script>
</body>
</html>
