
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Food - Jumbo Food Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main class="container">
    <h1>Search Jumbo Products</h1>
    <p>Search products and add them to your daily tracker.</p>

    <label for="product-search">Product Name</label>
    <input
        type="search"
        id="product-search"
        placeholder="Search milk, bread, chicken..."
        autocomplete="off"
    >

    <p id="search-status" class="muted">
        Type at least 3 characters to search.
    </p>

    <div id="product-results"></div>

    <p>
        <a href="{{ url_for('dashboard') }}">
            Back to Dashboard
        </a>
    </p>
</main>

<script>
    const searchInput = document.getElementById("product-search");
    const resultsContainer = document.getElementById("product-results");
    const searchStatus = document.getElementById("search-status");

    let searchTimeout;
    let activeController;

    function displayProducts(products) {
        resultsContainer.replaceChildren();

        if (products.length === 0) {
            searchStatus.textContent = "No Jumbo products found.";
            return;
        }

        searchStatus.textContent = `${products.length} products found`;

        products.forEach(product => {
            const card = document.createElement("div");
            card.className = "product-card";

            if (product.image) {
                const image = document.createElement("img");
                image.src = product.image;
                image.alt = product.name;
                image.loading = "lazy";
                card.appendChild(image);
            }

            const details = document.createElement("div");
            details.className = "product-details";

            const name = document.createElement("h3");
            name.textContent = product.name;

            const nutrition = document.createElement("p");
            nutrition.textContent =
                `${product.calories} kcal | ` +
                `P: ${product.protein}g | ` +
                `C: ${product.carbs}g | ` +
                `F: ${product.fat}g`;

            const link = document.createElement("a");
            link.href = `/food/select/${encodeURIComponent(product.barcode)}`;
            link.textContent = "Select Product";
            link.className = "action-link";

            details.append(name, nutrition, link);
            card.appendChild(details);

            resultsContainer.appendChild(card);
        });
    }

    searchInput.addEventListener("input", () => {
        clearTimeout(searchTimeout);

        if (activeController) {
            activeController.abort();
        }

        const query = searchInput.value.trim();

        resultsContainer.replaceChildren();

        if (query.length < 3) {
            searchStatus.textContent =
                "Type at least 3 characters to search.";
            return;
        }

        searchStatus.textContent = "Searching...";

        searchTimeout = setTimeout(async () => {
            const controller = new AbortController();
            activeController = controller;

            try {
                const response = await fetch(
                    `/api/products/search?query=${encodeURIComponent(query)}`,
                    {signal: controller.signal}
                );

                if (!response.ok) {
                    throw new Error("Search failed");
                }

                const products = await response.json();

                if (!controller.signal.aborted) {
                    displayProducts(products);
                }

            } catch (error) {
                if (error.name !== "AbortError") {
                    searchStatus.textContent =
                        "Unable to search products right now.";
                }
            }
        }, 500);
    });
</script>
</body>
</html>
